name: Build PathBot
 
on:
  push:
  workflow_dispatch:
 
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        # Sin "sdk": usa la version indicada en mod.json (5.11.2)
 
      - name: Upload .geode
        uses: actions/upload-artifact@v4
        with:
          name: PathBot
          path: ${{ steps.build.outputs.build-output }}
 
